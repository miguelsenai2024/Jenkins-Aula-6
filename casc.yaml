jenkins:
  systemMessage: "Jenkins Carparts - Aula 6 - configurado com JCasC"
  numExecutors: 0
  slaveAgentPort: 50000
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  nodes:
    - permanent:
        name: "linux-docker"
        remoteFS: "/home/jenkins/agent"
        numExecutors: 1
        labelString: "linux docker azure"
        mode: EXCLUSIVE
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              internalDir: "remoting"
              failIfWorkDirIsMissing: false
unclassified:
  location:
    url: "http://localhost:8080/"
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: github-scan
              username: x-access-token
              password: "${GITHUB_SCAN_TOKEN:-unused}"
              description: Token temporario para indexacao GitHub no laboratorio
# Cadastre fora do Git: azure-sp (usuario=client ID; senha=client secret),
# azure-tenant e azure-subscription (Secret text).
