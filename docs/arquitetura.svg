<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Arquitetura Jenkins Carparts">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#53657e"/></marker></defs>
<rect width="1200" height="760" fill="#f5f7fb"/>
<g font-family="Arial,sans-serif" fill="#182c47"><text x="48" y="56" font-size="28" font-weight="bold">Carparts | Jenkins CI/CD</text><text x="48" y="84" font-size="16">Controller local, builds em agents e promocao do mesmo digest com aprovacao registrada</text></g>
<rect x="35" y="124" width="740" height="565" rx="18" fill="#eaf0fa" stroke="#93abc9"/><rect x="805" y="124" width="360" height="565" rx="18" fill="#e7f5f0" stroke="#6fad98"/>
<g font-family="Arial,sans-serif" fill="#182c47" font-size="16"><text x="60" y="158" font-weight="bold">Rede local / laboratorio Ubuntu 24.04</text><text x="830" y="158" font-weight="bold">Azure | East US</text>
<rect x="65" y="190" width="310" height="126" rx="12" fill="white" stroke="#93abc9"/><text x="85" y="220" font-weight="bold">Jenkins controller | Docker + Java 21</text><text x="85" y="249">0 executores | JCasC | credenciais</text><text x="85" y="275">UI: 127.0.0.1:8080 autenticada</text><text x="85" y="299">50000 configurada, nao publicada</text>
<rect x="65" y="378" width="310" height="136" rx="12" fill="white" stroke="#93abc9"/><text x="85" y="408" font-weight="bold">Agent Linux | Java 21 + Node 22</text><text x="85" y="435">1 executor | linux docker azure</text><text x="85" y="462">Git, npm, Docker CLI, Azure CLI</text><text x="85" y="489">Recriado por workflow / dedicado local</text>
<rect x="435" y="378" width="305" height="136" rx="12" fill="white" stroke="#93abc9"/><text x="455" y="409" font-weight="bold">Docker-in-Docker</text><text x="455" y="438">Daemon separado | rede interna</text><text x="455" y="465">TLS em 2376 | certificados em volume</text><text x="455" y="490">Sem socket do host no controller</text>
<rect x="435" y="190" width="305" height="126" rx="12" fill="white" stroke="#93abc9"/><text x="455" y="220" font-weight="bold">GitHub | branches e PRs</text><text x="455" y="248">Jenkinsfile | check Jenkins CI</text><text x="455" y="275">Webhook HTTPS: configuracao pendente</text><text x="455" y="299">Actions fornece host temporario</text>
<rect x="65" y="561" width="675" height="92" rx="12" fill="#f8fafd" stroke="#93abc9" stroke-dasharray="6 4"/><text x="85" y="591" font-weight="bold">Extensao planejada: 2 agents Windows 11 | Java 21 | windows dotnet</text><text x="85" y="620">1 executor por agent, WebSocket; componentes .NET, fora da API deste laboratorio</text>
<rect x="835" y="190" width="300" height="96" rx="12" fill="white" stroke="#6fad98"/><text x="855" y="222" font-weight="bold">ACR Basic</text><text x="855" y="250">Imagem unica por commit e digest</text><text x="855" y="274">Jenkins: AcrPush | apps: AcrPull</text>
<rect x="835" y="350" width="300" height="110" rx="12" fill="white" stroke="#6fad98"/><text x="855" y="383" font-weight="bold">Container App | homologacao</text><text x="855" y="412">Smoke test HTTPS /health</text><text x="855" y="441">Confere commit e versao da imagem</text>
<rect x="835" y="551" width="300" height="102" rx="12" fill="white" stroke="#6fad98"/><text x="855" y="582" font-weight="bold">Container App | producao</text><text x="855" y="610">Mesmo digest, sem recompilar</text><text x="855" y="637">release.json: quem, quando e commit</text>
<text x="850" y="506" font-weight="bold">Aprovacao humana registrada</text><text x="850" y="530">Sem executor reservado na espera</text>
</g>
<g fill="none" stroke="#53657e" stroke-width="2" marker-end="url(#arrow)"><path d="M220 378V318"/><path d="M375 445H433"/><path d="M435 250H377"/><path d="M740 445H785V238H833"/><path d="M985 286V348"/><path d="M985 460V482"/><path d="M985 532V549"/></g>
<g font-family="Arial,sans-serif" font-size="13" fill="#53657e"><text x="231" y="351">WebSocket 8080</text><text x="378" y="432">TLS</text><text x="380" y="236">SCM</text><text x="756" y="423" transform="rotate(-90 756 423)">Push HTTPS 443 / Azure CLI</text><text x="48" y="723">Linhas tracejadas = extensao planejada. Azure e webhook precisam de recursos e acesso reais para validacao.</text></g>
</svg>
